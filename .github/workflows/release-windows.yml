name: Release Windows Host

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/runner/src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build protocol
        run: npm run build:protocol

      - name: Generate app icon (valid .ico for Windows)
        shell: pwsh
        working-directory: apps/runner
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = "app-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 512, 512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(16, 185, 129))
          $font = New-Object System.Drawing.Font("Arial", 48, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $g.DrawString("AI", $font, $brush, 200, 220)
          $g.Dispose()
          $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npm exec tauri icon $path

      - name: Build portable app (binary only, no installer)
        working-directory: apps/runner
        env:
          VITE_SUPABASE_URL: https://jcknolulyrsvcwvttaed.supabase.co
          VITE_APP_URL: https://ownmyownai-app-runner.vercel.app
        run: npm run tauri build -- --no-bundle

      - name: Package portable zip
        id: portable
        shell: pwsh
        run: |
          $release = "apps/runner/src-tauri/target/release"
          $staging = "apps/runner/portable-staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $staging | Out-Null

          $exe = Get-ChildItem $release -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "wix|nsis|installer" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Portable exe not found in $release" }
          Copy-Item $exe.FullName $staging

          Get-ChildItem $release -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $staging
          }

          $resources = Join-Path $release "resources"
          if (Test-Path $resources) {
            Copy-Item -Recurse $resources (Join-Path $staging "resources")
          }

          $zip = "apps/runner/OwnMyOwnAI-Host-portable-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zip
          Write-Host "Portable zip: $zip ($((Get-Item $zip).Length) bytes)"
          echo "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload ZIP to Supabase (téléchargement public sur le site)
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        shell: pwsh
        env:
          SUPABASE_URL: https://jcknolulyrsvcwvttaed.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $zip = "${{ steps.portable.outputs.path }}"
          $object = "latest/OwnMyOwnAI-Host-portable-x64.zip"
          $uri = "$env:SUPABASE_URL/storage/v1/object/host-releases/$object"
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
            "x-upsert" = "true"
            "Content-Type" = "application/zip"
          }
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -InFile $zip
          Write-Host "Public URL: $env:SUPABASE_URL/storage/v1/object/public/host-releases/$object"

      - name: Set release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (backup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OwnMyOwnAI Host ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.portable.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Build et publication du Host Windows (NSIS + auto-update signé).
#
# Secrets de dépôt requis (Settings → Secrets and variables → Actions) :
#   SUPABASE_SERVICE_ROLE_KEY          — upload Supabase Storage
#   TAURI_SIGNING_PRIVATE_KEY          — clé minisign base64 (une ligne)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — mot de passe de la clé
#
# Procédure : docs/AUTO_UPDATE.md et apps/runner/scripts/setup-tauri-signing.ps1

name: Release Windows Host

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/runner/src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build protocol
        run: npm run build:protocol

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match 'refs/tags/v(.+)') {
            $ver = $Matches[1]
          } else {
            $ver = "0.1.${{ github.run_number }}"
          }
          Write-Host "Version: $ver"
          echo "value=$ver" >> $env:GITHUB_OUTPUT
          $conf = Get-Content apps/runner/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 20 | Set-Content apps/runner/src-tauri/tauri.conf.json -Encoding UTF8

      - name: Configure updater signing
        id: signing
        shell: pwsh
        run: |
          function Test-MinisignKey([string]$Text) {
            return [bool]($Text -match "untrusted comment:")
          }

          function Get-DecodedSigningKey([string]$SecretValue) {
            if (Test-MinisignKey $SecretValue) {
              return $SecretValue
            }
            try {
              $bytes = [Convert]::FromBase64String($SecretValue.Trim())
              return [Text.Encoding]::UTF8.GetString($bytes)
            } catch {
              return $null
            }
          }

          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          $password = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $reason = ""
          $canSign = $false

          if (-not $key) {
            $reason = "secret TAURI_SIGNING_PRIVATE_KEY absent"
          } elseif (-not $password) {
            $reason = "secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD absent"
          } else {
            $decoded = Get-DecodedSigningKey $key
            if (-not (Test-MinisignKey $decoded)) {
              $reason = "TAURI_SIGNING_PRIVATE_KEY invalide (attendu : base64 d'une clé minisign — voir docs/AUTO_UPDATE.md)"
            } else {
              $canSign = $true
            }
          }

          if ($canSign) {
            Write-Host "Signature updater : activée"
          } else {
            Write-Host "::warning::Signature updater désactivée — $reason"
            Write-Host "::warning::Exécuter pwsh apps/runner/scripts/setup-tauri-signing.ps1 puis gh secret set (voir docs/AUTO_UPDATE.md)"
            $confPath = "apps/runner/src-tauri/tauri.conf.json"
            $conf = Get-Content $confPath -Raw | ConvertFrom-Json
            $conf.bundle.createUpdaterArtifacts = $false
            if ($conf.plugins.updater) { $conf.plugins.updater.active = $false }
            $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding UTF8
          }

          echo "can_sign=$canSign" >> $env:GITHUB_OUTPUT
          echo "reason=$reason" >> $env:GITHUB_OUTPUT

      - name: Generate app icon (valid .ico for Windows)
        shell: pwsh
        working-directory: apps/runner
        run: |
          Add-Type -AssemblyName System.Drawing
          $path = "app-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 512, 512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(16, 185, 129))
          $font = New-Object System.Drawing.Font("Arial", 48, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $g.DrawString("AI", $font, $brush, 200, 220)
          $g.Dispose()
          $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npm exec tauri icon $path

      - name: Build NSIS installer (auto-update)
        working-directory: apps/runner
        env:
          VITE_SUPABASE_URL: https://jcknolulyrsvcwvttaed.supabase.co
          VITE_APP_URL: ${{ vars.WEB_APP_URL || 'https://ownmyownai.app' }}
        run: npm run tauri build

      - name: Publish signed updater + installer to Supabase
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && steps.signing.outputs.can_sign == 'True' }}
        shell: pwsh
        run: |
          pwsh apps/runner/scripts/publish-host-release.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -SupabaseUrl "https://jcknolulyrsvcwvttaed.supabase.co" `
            -ServiceRoleKey "$env:SUPABASE_SERVICE_ROLE_KEY" `
            -Notes "Release v${{ steps.version.outputs.value }}"

      - name: Publish installer to Supabase (unsigned)
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && steps.signing.outputs.can_sign != 'True' }}
        shell: pwsh
        run: |
          pwsh apps/runner/scripts/publish-host-installer-only.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -SupabaseUrl "https://jcknolulyrsvcwvttaed.supabase.co" `
            -ServiceRoleKey "$env:SUPABASE_SERVICE_ROLE_KEY" `
            -Notes "Release v${{ steps.version.outputs.value }} (sans auto-update signé)"

      - name: Package portable zip (fallback manuel)
        id: portable
        shell: pwsh
        run: |
          $release = "apps/runner/src-tauri/target/release"
          $staging = "apps/runner/portable-staging"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $staging | Out-Null

          $exe = Get-ChildItem $release -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "wix|nsis|installer" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Portable exe not found in $release" }
          Copy-Item $exe.FullName $staging

          Get-ChildItem $release -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $staging
          }

          $resources = Join-Path $release "resources"
          if (Test-Path $resources) {
            Copy-Item -Recurse $resources (Join-Path $staging "resources")
          }

          Copy-Item "apps/runner/scripts/uninstall-host.ps1" $staging
          Copy-Item "apps/runner/scripts/Desinstaller.bat" $staging
          $readme = Join-Path $staging "LISEZMOI.txt"
          Set-Content -Path $readme -Encoding UTF8 -Value @(
            "OwnMyOwnAI Host - version portable (sans mise à jour auto)",
            "",
            "Pour les mises à jour automatiques, installez via OwnMyOwnAI-Host-setup.exe sur le site.",
            "",
            "1. Lancer l'application .exe",
            "2. Suivre l'assistant (Ollama + pairing)"
          )

          $zip = "apps/runner/OwnMyOwnAI-Host-portable-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zip
          echo "path=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload portable ZIP to Supabase
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: pwsh
        env:
          SUPABASE_URL: https://jcknolulyrsvcwvttaed.supabase.co
        run: |
          $zip = "${{ steps.portable.outputs.path }}"
          $object = "latest/OwnMyOwnAI-Host-portable-x64.zip"
          $uri = "$env:SUPABASE_URL/storage/v1/object/host-releases/$object"
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
            "x-upsert" = "true"
            "Content-Type" = "application/zip"
          }
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -InFile $zip

      - name: Set release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OwnMyOwnAI Host ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apps/runner/OwnMyOwnAI-Host-portable-x64.zip
            apps/runner/src-tauri/target/release/bundle/nsis/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Résumé release
        if: always()
        shell: pwsh
        run: |
          $signed = "${{ steps.signing.outputs.can_sign }}" -eq "True"
          $mode = if ($signed) { "auto-update signé" } else { "installateur seul (sans auto-update)" }
          $reason = "${{ steps.signing.outputs.reason }}"
          $summary = @(
            "## OwnMyOwnAI Host v${{ steps.version.outputs.value }}",
            "",
            "- Mode publication : **$mode**",
            "- Tag : `${{ steps.tag.outputs.name }}`"
          )
          if (-not $signed -and $reason) {
            $summary += "- Raison : $reason"
            $summary += "- Action : `pwsh apps/runner/scripts/setup-tauri-signing.ps1` puis `gh secret set` (voir `docs/AUTO_UPDATE.md`)"
          }
          if ($signed) {
            $summary += "- Manifeste : https://jcknolulyrsvcwvttaed.supabase.co/storage/v1/object/public/host-releases/latest/latest.json"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n")

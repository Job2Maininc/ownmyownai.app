name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/runner/src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm install
      - run: npm run build:protocol
      - run: npm run build --workspace=@ownmyownai/web
      - run: npm run typecheck --workspace=@ownmyownai/relay

      - name: Tests Vitest (protocol + web)
        run: npm test

      - name: Check runner (Rust)
        working-directory: apps/runner/src-tauri
        run: cargo check

      - name: Test runner (Rust)
        working-directory: apps/runner/src-tauri
        run: cargo test
